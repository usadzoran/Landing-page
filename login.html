<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تسجيل الدخول | NexaChat</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#1e293b,#111827);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.container{
width:92%;
max-width:390px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(18px);
padding:35px;
border-radius:25px;
border:1px solid rgba(255,255,255,.1);
box-shadow:0 20px 40px rgba(0,0,0,.35);
}

.logo{
font-size:55px;
text-align:center;
margin-bottom:10px;
}

h2{
text-align:center;
color:#fff;
margin-bottom:25px;
}

.inputBox{
margin-bottom:18px;
}

.inputBox label{
display:block;
color:#ddd;
margin-bottom:8px;
}

.inputBox input{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#ffffff;
font-size:16px;
outline:none;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#2563eb;
color:#fff;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:.3s;
margin-top:8px;
}

button:hover{
background:#1d4ed8;
}

.links{
margin-top:20px;
text-align:center;
}

.links a{
color:#60a5fa;
text-decoration:none;
display:block;
margin-top:12px;
}

.links a:hover{
text-decoration:underline;
}

.error{
display:none;
margin-top:15px;
padding:12px;
background:#dc2626;
color:white;
border-radius:10px;
text-align:center;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">💬</div>

<h2>تسجيل الدخول</h2>

<form id="loginForm">

<div class="inputBox">
<label>البريد الإلكتروني</label>
<input
type="email"
id="email"
placeholder="example@email.com"
required>
</div>

<div class="inputBox">
<label>كلمة المرور</label>
<input
type="password"
id="password"
placeholder="********"
required>
</div>

<button type="submit">
دخول
</button>

<div class="error" id="errorBox">
البريد الإلكتروني أو كلمة المرور غير صحيحة.
</div>

<div class="links">

<a href="register.html">
إنشاء حساب جديد
</a>

<a href="index.html">
⬅ العودة للرئيسية
</a>

</div>

</form>

</div>

<script>

document.getElementById("loginForm").addEventListener("submit",function(e){

e.preventDefault();

const email=document.getElementById("email").value.trim();

const password=document.getElementById("password").value.trim();

if(email===""||password===""){
document.getElementById("errorBox").style.display="block";
return;
}

/*
سيتم هنا ربط Supabase لاحقًا
*/

window.location.href="home.html";

});

</script>

</body>
  </html>
