<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NexaChat</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{

background:linear-gradient(135deg,#0f172a,#1e293b,#111827);

height:100vh;

display:flex;

justify-content:center;

align-items:center;

overflow:hidden;

}

.container{

width:92%;

max-width:390px;

padding:35px;

border-radius:25px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(18px);

box-shadow:0 20px 40px rgba(0,0,0,.35);

text-align:center;

border:1px solid rgba(255,255,255,.12);

animation:fade .8s;

}

.logo{

width:120px;

height:120px;

margin:auto;

border-radius:50%;

background:white;

display:flex;

justify-content:center;

align-items:center;

font-size:60px;

}

h1{

margin-top:20px;

color:white;

font-size:33px;

}

p{

margin-top:10px;

color:#d1d5db;

line-height:28px;

}

button{

width:100%;

padding:15px;

border:none;

border-radius:15px;

margin-top:18px;

font-size:18px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

.login{

background:#2563eb;

color:white;

}

.login:hover{

background:#1d4ed8;

}

.register{

background:white;

color:#111827;

}

.register:hover{

transform:scale(1.03);

}

.footer{

margin-top:25px;

color:#94a3b8;

font-size:14px;

}

@keyframes fade{

from{

opacity:0;

transform:translateY(30px);

}

to{

opacity:1;

transform:translateY(0);

}

}

</style>

</head>

<body>

<div class="container">

<div class="logo">

💬

</div>

<h1>NexaChat</h1>

<p>

تواصل مع أصدقائك بسرعة وأمان.

</p>

<button class="login" onclick="window.location='login.html'">

تسجيل الدخول

</button>

<button class="register" onclick="window.location='register.html'">

إنشاء حساب

</button>

<div class="footer">

الإصدار 1.0

</div>

</div>

</body>

</html>
