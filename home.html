<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NexaChat | الرئيسية</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:#f4f7fb;
}

header{

height:70px;

background:#2563eb;

display:flex;

justify-content:space-between;

align-items:center;

padding:0 20px;

color:#fff;

position:sticky;

top:0;

}

.logo{

font-size:22px;

font-weight:bold;

}

.icons{

display:flex;

gap:15px;

font-size:22px;

cursor:pointer;

}

.search{

padding:15px;

}

.search input{

width:100%;

padding:14px;

border:none;

border-radius:12px;

background:#fff;

font-size:16px;

outline:none;

box-shadow:0 2px 10px rgba(0,0,0,.08);

}

.list{

padding:0 15px 90px;

}

.user{

display:flex;

align-items:center;

background:#fff;

padding:12px;

margin-bottom:12px;

border-radius:15px;

cursor:pointer;

transition:.25s;

box-shadow:0 3px 10px rgba(0,0,0,.06);

}

.user:hover{

transform:scale(1.02);

}

.avatar{

width:60px;

height:60px;

border-radius:50%;

margin-left:12px;

}

.info{

flex:1;

}

.name{

font-size:18px;

font-weight:bold;

color:#111827;

}

.last{

font-size:14px;

color:#6b7280;

margin-top:4px;

}

.status{

width:12px;

height:12px;

background:#22c55e;

border-radius:50%;

}

.bottom{

position:fixed;

bottom:0;

left:0;

right:0;

height:70px;

background:#fff;

display:flex;

justify-content:space-around;

align-items:center;

box-shadow:0 -2px 10px rgba(0,0,0,.1);

}

.bottom button{

background:none;

border:none;

font-size:28px;

cursor:pointer;

}

</style>

</head>

<body>

<header>

<div class="logo">

NexaChat

</div>

<div class="icons">

🔔

⚙️

</div>

</header>

<div class="search">

<input type="text" placeholder="ابحث عن مستخدم...">

</div>

<div class="list">

<div class="user" onclick="window.location='chat.html'">

<img class="avatar" src="https://i.pravatar.cc/150?img=11">

<div class="info">

<div class="name">محمد</div>

<div class="last">

السلام عليكم

</div>

</div>

<div class="status"></div>

</div>

<div class="user" onclick="window.location='chat.html'">

<img class="avatar" src="https://i.pravatar.cc/150?img=32">

<div class="info">

<div class="name">أحمد</div>

<div class="last">

كيف حالك؟

</div>

</div>

<div class="status"></div>

</div>

<div class="user" onclick="window.location='chat.html'">

<img class="avatar" src="https://i.pravatar.cc/150?img=52">

<div class="info">

<div class="name">سارة</div>

<div class="last">

تم إرسال الصورة

</div>

</div>

<div class="status"></div>

</div>

</div>

<div class="bottom">

<button onclick="window.location='home.html'">

🏠

</button>

<button onclick="window.location='profile.html'">

👤

</button>

<button onclick="window.location='settings.html'">

⚙️

</button>

</div>

</body>

</html>
