<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NexaChat | الملف الشخصي</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:#f4f7fb;
}

header{
height:70px;
background:#2563eb;
display:flex;
align-items:center;
padding:0 20px;
color:#fff;
font-size:22px;
font-weight:bold;
box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.back{
margin-left:15px;
cursor:pointer;
font-size:26px;
}

.container{
padding:25px;
text-align:center;
}

.avatar-box{
position:relative;
display:inline-block;
}

.avatar{
width:140px;
height:140px;
border-radius:50%;
border:5px solid #2563eb;
object-fit:cover;
}

.change{
position:absolute;
bottom:5px;
left:5px;
width:42px;
height:42px;
border-radius:50%;
border:none;
background:#2563eb;
color:#fff;
font-size:20px;
cursor:pointer;
}

h2{
margin-top:20px;
color:#111827;
}

.email{
margin-top:8px;
color:#6b7280;
}

.card{
background:#fff;
margin-top:30px;
border-radius:18px;
padding:18px;
box-shadow:0 3px 10px rgba(0,0,0,.08);
text-align:right;
}

.item{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 0;
border-bottom:1px solid #eee;
}

.item:last-child{
border:none;
}

.title{
font-size:16px;
font-weight:bold;
color:#111827;
}

.value{
color:#6b7280;
}

.btn{
margin-top:30px;
width:100%;
padding:16px;
border:none;
border-radius:14px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.edit{
background:#2563eb;
color:#fff;
margin-bottom:15px;
}

.logout{
background:#dc2626;
color:#fff;
}

</style>

</head>

<body>

<header>

<div class="back" onclick="window.location='home.html'">
⬅
</div>

الملف الشخصي

</header>

<div class="container">

<div class="avatar-box">

<img class="avatar" src="https://i.pravatar.cc/300?img=11">

<button class="change">
📷
</button>

</div>

<h2>محمد أحمد</h2>

<div class="email">
mohamed@email.com
</div>

<div class="card">

<div class="item">
<div class="title">رقم الهاتف</div>
<div class="value">+213 555 00 00 00</div>
</div>

<div class="item">
<div class="title">الحالة</div>
<div class="value">متصل الآن</div>
</div>

<div class="item">
<div class="title">عدد المحادثات</div>
<div class="value">18</div>
</div>

<div class="item">
<div class="title">تاريخ الانضمام</div>
<div class="value">02/07/2026</div>
</div>

</div>

<button class="btn edit">
تعديل الملف الشخصي
</button>

<button class="btn logout" onclick="window.location='login.html'">
تسجيل الخروج
</button>

</div>

</body>

  </html>
